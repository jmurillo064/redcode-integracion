spring.application.name=SpringBootCamelRestKeyclock

#Configurar Keycloack
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/spring-boot-realm-dev
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9090/realms/spring-boot-realm-dev/protocol/openid-connect/certs

jwt.auth.converter.principal-atribute=preferred_username
jwt.auth.converter.resource-id=spring-client-api-rest

## Logging
logging.pattern.console=%d{dd-MM-yyyy HH:mm:ss} %magenta([%thread]) %highlight(%-5level) %logger.%M - %msg%n
logging.level.org.keycloak=DEBUG
logging.level.org.springframework.security=DEBUG

# ===== CONFIGURACIÓN DE SPRINGDOC (Para Spring Boot Controllers) =====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# URLs múltiples para mostrar AMBAS APIs en Swagger UI
springdoc.swagger-ui.urls[0].name=Spring Boot Controllers
springdoc.swagger-ui.urls[0].url=/v3/api-docs
springdoc.swagger-ui.urls[1].name=Camel REST API
springdoc.swagger-ui.urls[1].url=/camel/api/api-doc

# Configuración adicional de SpringDoc
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.displayRequestDuration=true

# ===== CONFIGURACIÓN DE CAMEL =====
# Configuración de Camel Servlet
camel.servlet.mapping.context-path=/camel/api/*
camel.rest.component=servlet
camel.rest.data-format-property.prettyPrint=true
camel.rest.binding-mode=json
camel.rest.enable-cors=true

# Configuración general de Camel
camel.springboot.main-run-controller=true

# ===== CONFIGURACIÓN DE LOGGING =====
logging.level.ec.redcode.net=DEBUG
logging.level.org.apache.camel=INFO
